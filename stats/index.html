<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Statistiky návštěv – Goldenray</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;background:#f6f9fb;color:#111;margin:0}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:32px 40px;max-width:760px;width:100%;text-align:center}
    h1{margin:0 0 6px;font-size:24px}
    .subtitle{color:#666;margin:0 0 16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
    .tile{border:1px solid #eee;border-radius:14px;padding:18px}
    .label{color:#777;font-size:13px}
    .big{font-size:40px;font-weight:800;margin:6px 0}
    #updated{margin-top:16px;color:#666;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>📊 Statistiky webu Goldenray</h1>
      <div class="grid">
        <div class="tile">
          <div class="label">Návštěvy dnes</div>
          <div id="today" class="big">–</div>
        </div>
        <div class="tile">
          <div class="label">Právě aktivní</div>
          <div id="active" class="big">–</div>
        </div>
      </div>
      <div id="updated">Načítám data…</div>
      <div class="grid" style="margin-top:16px">
  <div class="tile">
    <div class="label">Top země (dnes)</div>
    <ol id="countries" style="text-align:left;margin:8px 0 0 18px"></ol>
  </div>
  <div class="tile">
    <div class="label">Top stránky (dnes)</div>
    <ol id="pages" style="text-align:left;margin:8px 0 0 18px"></ol>
  </div>
</div>

    </div>
  </div>

  <script>
    // ↓↓↓ po nasazení Workeru jen vyměníš URL za svou ve tvaru https://NAZEV.workers.dev/metrics
    const API = "https://rapid-limit-6e53.primosten-sunhill.workers.dev/metrics";

  async function refresh() {
  try {
    const r = await fetch(API, { cache: "no-store" });
    const d = await r.json();

    document.getElementById("today").textContent  = d.today ?? 0;
    document.getElementById("active").textContent = d.active ?? 0;

    // TOP země
    const cEl = document.getElementById("countries");
    cEl.innerHTML = (d.countries || [])
      .map(x => `<li>${x.code} — ${x.count}</li>`)
      .join("") || "<li>–</li>";

    // TOP stránky
    const pEl = document.getElementById("pages");
    pEl.innerHTML = (d.pages || [])
      .map(x => `<li>${x.path} — ${x.count}</li>`)
      .join("") || "<li>–</li>";

    document.getElementById("updated").textContent =
      "Aktualizováno: " + new Date().toLocaleTimeString("cs-CZ");
  } catch {
    document.getElementById("updated").textContent = "Nepodařilo se načíst data.";
  }
}

refresh();
setInterval(refresh, 10000);

  </script>
</body>
</html>
